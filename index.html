<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SICLAR Lanchonete</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div>
      <h1 id="nomeEmpresa">SICLAR Lanchonete</h1>
      <p id="subtituloEmpresa">Peça pelo celular e envie direto no WhatsApp</p>
    </div>
    <div class="mesa-chip" id="mesaChip">Mesa não informada</div>
  </header>

  <main class="layout">
    <section class="catalogo">
      <div class="barra-busca">
        <input id="busca" type="search" placeholder="Pesquisar lanche, bebida, porção..." autocomplete="off">
      </div>
      <div id="categorias" class="categorias"></div>
      <div id="grade" class="grade"></div>
    </section>

    <aside class="carrinho">
      <div class="carrinho-topo">
        <div>
          <small>Seu pedido</small>
          <h2 id="resumoQtd">Nenhum item</h2>
        </div>
        <strong id="totalTopo">R$ 0,00</strong>
      </div>

      <div id="itensCarrinho" class="itens-carrinho vazio">Seu carrinho está vazio.</div>

      <div class="checkout">
        <label>Seu nome
          <input id="nomeCliente" type="text" placeholder="Ex.: Paulo" maxlength="60">
        </label>
        <label>Mesa
          <input id="mesa" type="text" placeholder="Ex.: 07" maxlength="10">
        </label>
        <label>Forma de pagamento
          <select id="pagamento">
            <option>PIX</option>
            <option>DINHEIRO</option>
            <option>CARTÃO</option>
          </select>
        </label>
        <label>Observação geral
          <textarea id="observacao" rows="3" placeholder="Ex.: sem cebola, trazer guardanapo..."></textarea>
        </label>
        <div class="total-final"><span>Total</span><strong id="totalFinal">R$ 0,00</strong></div>
        <button id="btnEnviar" class="btn-enviar" type="button">Enviar pedido pelo WhatsApp</button>
      </div>
    </aside>
  </main>

  <div class="barra-mobile" id="barraMobile">
    <div><small>Total</small><strong id="totalMobile">R$ 0,00</strong></div>
    <button type="button" id="btnVerPedido">Ver pedido</button>
  </div>

  <div id="modalObs" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-fechar" id="fecharModal" type="button">×</button>
      <h3 id="modalTitulo">Observação do item</h3>
      <p id="modalPreco"></p>
      <label>Observação deste item
        <textarea id="obsItem" rows="3" placeholder="Ex.: sem tomate, ponto da carne..."></textarea>
      </label>
      <button id="confirmarItem" class="btn-enviar" type="button">Adicionar ao pedido</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/cardapio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
